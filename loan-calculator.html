<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loan Calculator</title>
<style>
  body { font-family: sans-serif; text-align: center; margin: 0; padding: 30px 16px; }
  form {
    display: inline-grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center;
    width: min(100%, 420px); box-sizing: border-box; text-align: left;
    padding: 20px; border: 1px solid #ccc; border-radius: 8px;
  }
  form label { font-weight: bold; }
  form input, form select { padding: 6px; font-size: 1rem; width: 100%; box-sizing: border-box; }
  .term { display: flex; gap: 6px; }
  .term select { width: auto; }
  form button { grid-column: 1 / -1; padding: 8px; font-size: 1rem; cursor: pointer; }
  #error { color: #b91c1c; min-height: 1.2em; margin: 10px; }
  .summary { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 10px 0 20px; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px 18px; min-width: 140px; }
  .card .label { font-size: .85rem; color: #555; }
  .card .value { font-size: 1.4rem; font-weight: bold; margin-top: 4px; }
  #breakdown {
    display: flex; height: 18px; width: min(100%, 420px); margin: 0 auto 6px;
    border-radius: 9px; overflow: hidden; background: #eee;
  }
  #breakdown .principal { background: #2563eb; }
  #breakdown .interest { background: #f59e0b; }
  .legend { font-size: .85rem; margin-bottom: 20px; }
  .legend span::before {
    content: ''; display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 12px; border-radius: 2px;
  }
  .legend .principal::before { background: #2563eb; }
  .legend .interest::before { background: #f59e0b; }
  .table-wrap { max-width: 640px; margin: 0 auto; max-height: 400px; overflow: auto; border: 1px solid #ccc; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid #eee; }
  th { position: sticky; top: 0; background: #f3f3f3; }
  tfoot td { position: sticky; bottom: 0; background: #f3f3f3; font-weight: bold; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>Loan Calculator</h1>
  <form id="form">
    <label for="currency">Currency</label>
    <select id="currency">
      <option value="USD">US dollars ($)</option>
      <option value="EUR">Euros (€)</option>
    </select>

    <label for="amount">Loan amount (<span class="symbol">$</span>)</label>
    <input id="amount" type="number" min="0" step="any" value="25000" required>

    <label for="rate">Interest rate (% per year)</label>
    <input id="rate" type="number" min="0" step="any" value="6.5" required>

    <label for="term">Loan term</label>
    <div class="term">
      <input id="term" type="number" min="1" step="1" value="5" required>
      <select id="termUnit">
        <option value="12">years</option>
        <option value="1">months</option>
      </select>
    </div>

    <label for="extra">Extra monthly payment (<span class="symbol">$</span>)</label>
    <input id="extra" type="number" min="0" step="any" value="0">

    <button type="submit">Calculate</button>
  </form>

  <div id="error"></div>

  <div id="results" hidden>
    <div class="summary">
      <div class="card"><div class="label">Monthly payment</div><div class="value" id="payment"></div></div>
      <div class="card"><div class="label">Total paid</div><div class="value" id="total"></div></div>
      <div class="card"><div class="label">Paid off in</div><div class="value" id="months"></div></div>
    </div>
    <div id="breakdown"><div class="principal"></div><div class="interest"></div></div>
    <div class="legend"><span class="principal">Principal</span><span class="interest">Interest</span></div>
    <p id="savings"></p>

    <h2>Amortization schedule</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Month</th><th>Payment</th><th>Principal</th><th>Interest</th><th>Total interest</th><th>Balance</th></tr></thead>
        <tbody id="schedule"></tbody>
        <tfoot id="totals"></tfoot>
      </table>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const SYMBOLS = { USD: '$', EUR: '€' };
  const money = n => n.toLocaleString('en-US', { style: 'currency', currency: $('currency').value });

  // Standard fixed-rate payment: P * r / (1 - (1 + r)^-n), where r is the monthly rate.
  // With a 0% rate, the loan is just split evenly across the months.
  function monthlyPayment(principal, monthlyRate, months) {
    if (monthlyRate === 0) return principal / months;
    return principal * monthlyRate / (1 - Math.pow(1 + monthlyRate, -months));
  }

  // Month-by-month rows. Each payment covers that month's interest first; the rest reduces the balance.
  // Any extra payment goes straight to the balance, so the loan may finish early.
  function amortize(principal, monthlyRate, payment, extra) {
    const rows = [];
    let balance = principal;
    while (balance > 0.005) {
      const interest = balance * monthlyRate;
      const principalPaid = Math.min(payment + extra - interest, balance);
      balance -= principalPaid;
      rows.push({ month: rows.length + 1, payment: principalPaid + interest, principal: principalPaid, interest, balance });
    }
    return rows;
  }

  const sum = (rows, key) => rows.reduce((total, row) => total + row[key], 0);

  function formatMonths(n) {
    const years = Math.floor(n / 12), months = n % 12;
    const parts = [];
    if (years) parts.push(`${years} yr`);
    if (months) parts.push(`${months} mo`);
    return parts.join(' ');
  }

  function calculate() {
    const principal = parseFloat($('amount').value);
    const annualRate = parseFloat($('rate').value);
    const months = Math.round(parseFloat($('term').value) * Number($('termUnit').value));
    const extra = parseFloat($('extra').value) || 0;

    $('error').textContent = '';
    if (!(principal > 0) || !(annualRate >= 0) || !(months >= 1) || extra < 0) {
      $('error').textContent = 'Please enter a positive loan amount and term, and a rate and extra payment of 0 or more.';
      $('results').hidden = true;
      return;
    }

    const monthlyRate = annualRate / 100 / 12;
    const payment = monthlyPayment(principal, monthlyRate, months);
    const rows = amortize(principal, monthlyRate, payment, extra);
    const totalInterest = sum(rows, 'interest');

    $('payment').textContent = money(payment + extra);
    $('total').textContent = money(principal + totalInterest);
    $('months').textContent = formatMonths(rows.length);

    const principalShare = principal / (principal + totalInterest) * 100;
    $('breakdown').querySelector('.principal').style.width = principalShare + '%';
    $('breakdown').querySelector('.interest').style.width = (100 - principalShare) + '%';

    // Compare against paying only the required amount.
    if (extra > 0) {
      const baseInterest = sum(amortize(principal, monthlyRate, payment, 0), 'interest');
      $('savings').textContent = `Paying ${money(extra)} extra each month saves ${money(baseInterest - totalInterest)} ` +
        `in interest and pays the loan off ${formatMonths(months - rows.length) || 'no'} sooner.`;
    } else {
      $('savings').textContent = '';
    }

    // Running total of interest paid so far, shown alongside each month.
    let interestSoFar = 0;
    $('schedule').innerHTML = rows.map(r => {
      interestSoFar += r.interest;
      return `<tr><td>${r.month}</td><td>${money(r.payment)}</td><td>${money(r.principal)}</td>` +
        `<td>${money(r.interest)}</td><td>${money(interestSoFar)}</td><td>${money(Math.max(r.balance, 0))}</td></tr>`;
    }).join('');
    $('totals').innerHTML = `<tr><td>Total</td><td>${money(sum(rows, 'payment'))}</td><td>${money(sum(rows, 'principal'))}</td>` +
      `<td>${money(totalInterest)}</td><td></td><td></td></tr>`;
    $('results').hidden = false;
  }

  $('form').onsubmit = e => { e.preventDefault(); calculate(); };

  // Switching currency only changes the symbol shown; amounts are not converted.
  function updateCurrency() {
    document.querySelectorAll('.symbol').forEach(el => el.textContent = SYMBOLS[$('currency').value]);
    calculate();
  }
  $('currency').onchange = updateCurrency;
  updateCurrency(); // the browser may restore the last choice on reload
</script>
</body>
</html>
