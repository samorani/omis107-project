# Runs the pytest suite on every pull request and every push to main.
#
# The job starts its own throwaway PostgreSQL server as a service container and
# points TEST_DATABASE_URL at it. No Neon connection string is used or needed:
# DATABASE_URL is deliberately left unset, and the tests refuse to run if it ever
# equalled TEST_DATABASE_URL. This workflow never deploys anything.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signup
          POSTGRES_PASSWORD: signup
          POSTGRES_DB: signup_test
        ports:
          - 5432:5432
        # Wait until the server accepts connections before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U signup -d signup_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://signup:signup@localhost:5432/signup_test
      SECRET_KEY: ci-only-secret-key
      ADMIN_USERNAME: admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -v
